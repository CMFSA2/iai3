<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
  </head>
  <body>
    <title>Mau Dibawa ke Mana Ikatan Alumni?</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/article1.css" />

    <a class="skip" href="#isi">Lewati ke isi tulisan</a>

    <!--div class="notice" id="notice" role="note" hidden>
      <div class="wrap notice-in">
        <p>
          Mode contoh: judul, isi, foto, dan nama di halaman ini masih data
          sampel. Ganti isi <code>CONTENT</code> di bagian bawah file. Isi
          <code>site.home</code> agar menu mengarah ke situs utama.
        </p>
        <button type="button" data-action="dismiss-notice">Tutup</button>
      </div>
    </div-->

    <header class="site-header">
      <div class="wrap">
        <div class="dock">
          <a
            class="brand"
            id="brandLink"
            data-nav
            href="#"
            aria-label="Alumni Institut Injil Indonesia, ke beranda"
          >
            <span class="brand-logo" id="brandLogo"></span>
            <span class="brand-text"
              ><b>Ikatan Alumni</b
              ><span>Institut Injil Indonesia · Batu</span></span
            >
          </a>
          <nav
            class="nav-links"
            aria-label="Navigasi utama"
            id="navLinks"
          ></nav>
          <div class="nav-tools">
            <button
              class="icon-btn"
              type="button"
              data-action="theme"
              aria-label="Ganti tema terang atau gelap"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <circle
                  cx="12"
                  cy="12"
                  r="9"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" />
              </svg>
            </button>
            <a
              class="btn btn-primary nav-cta"
              id="navCta"
              data-nav
              href="#rekening"
              >Dukung alumni</a
            >
            <button
              class="icon-btn menu-btn"
              type="button"
              data-action="menu"
              aria-expanded="false"
              aria-controls="mobileMenu"
            >
              <span class="bars" aria-hidden="true"></span
              ><span class="menu-label">Menu</span>
            </button>
          </div>
          <span class="progress" aria-hidden="true"><i id="progress"></i></span>
        </div>
        <nav
          class="sheet"
          id="mobileMenu"
          aria-label="Navigasi seluler"
          hidden
        ></nav>
      </div>
    </header>

    <main id="main">
      <article id="post">
        <header class="post-head">
          <div class="wrap">
            <div class="in" id="postHead"></div>
          </div>
        </header>

        <div class="wrap">
          <div class="cover" id="cover"></div>
        </div>

        <div class="post-body">
          <div class="wrap">
            <div class="post-grid">
              <aside class="side" aria-label="Alat baca">
                <nav class="side-block toc" id="tocBox" aria-label="Daftar isi">
                  <p class="eyebrow">Di halaman ini</p>
                  <ol id="tocList"></ol>
                </nav>
                <div class="side-block">
                  <p class="eyebrow">Ukuran teks</p>
                  <div class="size-ctl">
                    <button
                      class="icon-btn"
                      type="button"
                      data-action="size"
                      data-d="-1"
                      id="sizeDown"
                      aria-label="Perkecil teks"
                    >
                      A−
                    </button>
                    <button
                      class="icon-btn"
                      type="button"
                      data-action="size"
                      data-d="1"
                      id="sizeUp"
                      aria-label="Perbesar teks"
                    >
                      A+
                    </button>
                    <output id="sizeLabel" aria-live="polite"></output>
                  </div>
                </div>
                <div class="side-block">
                  <p class="eyebrow">Bagikan</p>
                  <div class="share" id="shareSide"></div>
                </div>
              </aside>

              <div id="isi" tabindex="-1">
                <dl class="facts" id="facts"></dl>
                <div class="prose" id="prose"></div>
                <div class="endmatter" id="endmatter"></div>
              </div>
            </div>
          </div>
        </div>
      </article>

      <section class="section band" id="terkait" hidden>
        <div class="wrap">
          <div class="sec-head">
            <p class="eyebrow">Baca juga</p>
            <h2>Tulisan lain dari alumni</h2>
          </div>
          <div class="rel-list" id="related"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap foot">
        <p id="footText"></p>
        <nav aria-label="Navigasi footer" id="footNav"></nav>
      </div>
    </footer>

    <!-- Pratinjau foto -->
    <div
      class="overlay"
      id="lightbox"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Pratinjau foto"
    >
      <div class="panel lb-panel">
        <button
          class="icon-btn lb-close"
          type="button"
          data-close
          aria-label="Tutup pratinjau"
        >
          Tutup
        </button>
        <div class="lb-media" id="lbMedia"></div>
        <div class="lb-cap" id="lbCap"></div>
        <div class="lb-ctl">
          <button
            class="icon-btn"
            type="button"
            data-action="lb-prev"
            id="lbPrev"
          >
            Sebelumnya
          </button>
          <span class="result-count" id="lbCount" aria-live="polite"></span>
          <button
            class="icon-btn"
            type="button"
            data-action="lb-next"
            id="lbNext"
          >
            Berikutnya
          </button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript
      ><p style="padding: 24px">
        Halaman ini memerlukan JavaScript untuk menampilkan konten.
      </p></noscript
    >
    <script src="js/article1.js"></script>
  </body>
</html>
